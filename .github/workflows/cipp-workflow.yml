name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # The deploy action builds with Oryx, which only offers the Node versions baked into
      # its image. Upstream pins engines.node ahead of that list, so Oryx rejects the build
      # before it starts. Build here with the exact version package.json asks for and hand
      # the deploy action a finished site instead. This mirrors upstream's own build workflow.
      - name: Get Node version
        id: get_node_version
        run: |
          node_raw_version=$(node -p "require('./package.json').engines.node")
          node_sanitized_version=$(echo "$node_raw_version" | sed -E 's/[^0-9.]+//g')
          echo "node_version=$node_sanitized_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: npm run build

      - name: Stamp version.json with commit
        run: |
          version=$(jq -r '.version' public/version.json)
          short_sha="${GITHUB_SHA::7}"
          echo "{\"version\": \"${version}\", \"commit\": \"${short_sha}\"}" > out/version.json

      - name: Copy Static Web Apps config into build output
        run: cp staticwebapp.config.json out/

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GROUND_0E2B47B10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "out"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GROUND_0E2B47B10 }}
          action: "close"
